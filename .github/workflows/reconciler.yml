name: reconciler

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the property tests with many more random histories.
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: reconciler

jobs:
  test:
    name: Typecheck, unit, property and replay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        env:
          FC_RUNS: ${{ github.event_name == 'schedule' && '3000' || '200' }}
        run: npm test

  e2e:
    name: End to end against the real Loan Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install contract dependencies
        working-directory: contracts
        run: npm install --no-audit --no-fund

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      - name: Install reconciler dependencies
        run: npm ci --no-audit --no-fund

      # Starts its own hardhat node, deploys LoanRegistry and mock stablecoins, and drives the CLI.
      - name: End-to-end tests
        run: npm run test:e2e
